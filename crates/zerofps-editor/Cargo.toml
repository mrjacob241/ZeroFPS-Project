[package]
name = "zerofps-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { workspace = true, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui.workspace = true
egui-wgpu = "0.31"
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
zerofps-core = { path = "../zerofps-core" }
zerofps-assets = { path = "../zerofps-assets" }
zerofps-formats = { path = "../zerofps-formats" }
zerofps-telemetry = { path = "../zerofps-telemetry" }
zerofps-voxel = { path = "../zerofps-voxel" }
pollster = "0.4"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[[bin]]
name = "zerofps-editor"
path = "src/main.rs"
