[workspace]
members = [
    "crates/zerofps-core",
    "crates/zerofps-formats",
    "crates/zerofps-assets",
    "crates/zerofps-telemetry",
    "crates/zerofps-editor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.31", default-features = false }
egui = "0.31"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
